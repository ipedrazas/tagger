name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Least privilege by default; the publish job widens it for itself.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/ipedrazas/tagger/tagger

jobs:
  build:
    name: lint, generate, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # `git describe` needs the tag history to derive a version.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          # Single source of truth for the toolchain, shared with local dev.
          go-version-file: .go-version
          cache: true

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "31.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install go-task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify generated code is current
        run: task generate:check

      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          # Same linter version `task lint` uses locally, so CI and a
          # workstation cannot disagree about what passes.
          version: v2.13.2

      - name: Unit tests
        # No OPENROUTER_API_KEY: the LLM is mocked, and the absence proves it.
        run: task test

      - name: Integration tests (REST + gRPC over real sockets, stubbed upstream)
        run: task test:integration

      - name: Build
        run: task build

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  image:
    name: build and push image
    needs: build
    runs-on: ubuntu-latest
    # Only publish from trunk and tags; PRs from forks must never get a token
    # that can write packages.
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # The same Dockerfile CI uses is the one developers build locally.
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the published image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # Any of the pushed tags resolves to the same digest; take the first.
          IMAGE_REF=$(echo "$TAGS" | head -n1)
          docker run --rm -d --name tagger-smoke -p 8080:8080 -p 9090:9090 \
            -e OPENROUTER_API_KEY=smoke-test-key "$IMAGE_REF"
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health >/dev/null; then
              echo "healthy"
              docker rm -f tagger-smoke
              exit 0
            fi
            sleep 1
          done
          echo "service never became healthy" >&2
          docker logs tagger-smoke >&2
          docker rm -f tagger-smoke
          exit 1
