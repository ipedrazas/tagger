# Service-only stack: `docker compose up --build`.
#
# Requires OPENROUTER_API_KEY in the environment or in a .env file next to this
# one (see .env.example).

services:
  tagger:
    build:
      context: .
      args:
        VERSION: ${VERSION:-compose}
    image: ghcr.io/ipedrazas/tagger/tagger:${TAG:-latest}
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "${GRPC_PORT:-9090}:9090"
    environment:
      # Required. Compose fails fast rather than starting an unusable service.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in your environment or .env}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      HTTP_ADDR: ":8080"
      GRPC_ADDR: ":9090"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAX_TAGS: ${MAX_TAGS:-8}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-30s}
      APP_NAME: tagger
    healthcheck:
      test: ["CMD", "/usr/local/bin/tagger", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
